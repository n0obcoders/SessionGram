<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>SessionGram</title>
<style>
  :root { --grad: linear-gradient(135deg, #6366f1 0%, #4c6ef5 45%, #22b8cf 100%); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1020; color: #fff;
    font-family: "Inter", Roboto, -apple-system, "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; user-select: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  .glow { position: fixed; width: 120vmax; height: 120vmax; left: 50%; top: 38%; transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(99,102,241,.35), rgba(34,184,207,.12) 35%, transparent 60%); pointer-events: none; animation: breathe 6s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: translate(-50%, -50%) scale(1.08); opacity: .8; } }
  main { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; padding: max(28px, env(safe-area-inset-top)) 0 max(22px, env(safe-area-inset-bottom)); }
  .skip { position: fixed; top: max(14px, env(safe-area-inset-top)); right: 14px; z-index: 5; color: rgba(255,255,255,.75); font: 600 14px inherit;
    background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18); padding: 8px 14px; border-radius: 999px; backdrop-filter: blur(8px); }
  .skip:disabled { opacity: .35; }
  .logo { margin-top: 6vh; width: 118px; height: 118px; border-radius: 34px; position: relative; cursor: pointer;
    box-shadow: 0 20px 60px rgba(76,110,245,.55), 0 0 0 1px rgba(255,255,255,.15) inset; animation: drop .9s cubic-bezier(.2,1.4,.4,1) both; transition: transform .25s; }
  .logo svg { width: 100%; height: 100%; display: block; border-radius: 34px; }
  .logo.spin { animation: spinpop .9s cubic-bezier(.2,1.2,.4,1); }
  .logo::after { content: ""; position: absolute; inset: -14px; border-radius: 44px; border: 2px solid rgba(255,255,255,.18); animation: ring 2.4s ease-out infinite; }
  @keyframes ring { from { transform: scale(.9); opacity: 1; } to { transform: scale(1.25); opacity: 0; } }
  @keyframes drop { from { transform: translateY(-40px) scale(.5); opacity: 0; } }
  @keyframes spinpop { 50% { transform: rotate(200deg) scale(1.15); } to { transform: rotate(360deg); } }
  h1 { margin: 22px 0 4px; font-size: 40px; font-weight: 800; letter-spacing: -.03em; display: flex; }
  h1 span { display: inline-block; background: linear-gradient(180deg, #fff, #c7d2fe); -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: letter .6s cubic-bezier(.2,1.5,.4,1) both; cursor: pointer; }
  h1 span.hop { animation: hop .5s cubic-bezier(.2,1.6,.4,1); }
  @keyframes letter { from { transform: translateY(30px) rotate(12deg); opacity: 0; } }
  @keyframes hop { 40% { transform: translateY(-16px) scale(1.2); } }
  .tag { color: rgba(255,255,255,.7); font-size: 15px; margin-bottom: 4px; animation: fadeup .8s .9s both; }
  .credit { font-size: 17px; min-height: 26px; color: #fff; font-weight: 600; margin-top: 10px; }
  .credit .cur { display: inline-block; width: 2px; height: 18px; background: #8fd3ff; margin-left: 2px; vertical-align: -3px; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes fadeup { from { transform: translateY(12px); opacity: 0; } }
  .cards { margin-top: auto; width: 100%; display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 18px 9vw 10px; scrollbar-width: none; perspective: 900px; }
  .cards::-webkit-scrollbar { display: none; }
  .card { flex: none; width: 82vw; max-width: 360px; scroll-snap-align: center; border-radius: 24px; padding: 18px 18px 16px; text-decoration: none; color: #fff;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    transform-style: preserve-3d; transition: transform .15s ease-out, background .2s; position: relative; overflow: hidden; animation: fadeup .7s both; }
  .card:nth-child(1) { animation-delay: 1.4s; } .card:nth-child(2) { animation-delay: 1.55s; } .card:nth-child(3) { animation-delay: 1.7s; }
  .card:active { background: rgba(255,255,255,.14); }
  .card .shine { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(400px circle at var(--mx, 50%) var(--my, 0%), rgba(255,255,255,.18), transparent 40%); }
  .card .ic { width: 46px; height: 46px; border-radius: 15px; display: grid; place-items: center; font-size: 22px; margin-bottom: 12px; transform: translateZ(30px); }
  .card .k { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: rgba(255,255,255,.6); font-weight: 700; }
  .card .v { font-size: 19px; font-weight: 700; margin-top: 3px; word-break: break-all; transform: translateZ(20px); }
  .card .go { margin-top: 10px; font-size: 13px; color: #8fd3ff; font-weight: 600; }
  .dots { display: flex; gap: 7px; justify-content: center; margin: 4px 0 14px; }
  .dots i { width: 7px; height: 7px; border-radius: 4px; background: rgba(255,255,255,.3); transition: width .2s, background .2s; }
  .dots i.on { width: 20px; background: #fff; }
  .foot { width: 100%; max-width: 420px; padding: 0 22px; animation: fadeup .7s 1.9s both; }
  .status { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; color: rgba(255,255,255,.7); margin-bottom: 12px; min-height: 18px; text-align: center; }
  .status .sp { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; animation: rot .8s linear infinite; flex: none; }
  .status.ok .sp { animation: none; border-color: #4ade80; background: #4ade80; }
  .status.bad { color: #fca5a5; } .status.bad .sp { display: none; }
  @keyframes rot { to { transform: rotate(360deg); } }
  .enter { width: 100%; height: 56px; border: 0; border-radius: 18px; background: var(--grad); color: #fff; font: 700 17px inherit; letter-spacing: .01em; position: relative; overflow: hidden;
    box-shadow: 0 14px 34px rgba(76,110,245,.5); transition: transform .12s, opacity .2s; }
  .enter:disabled { opacity: .45; box-shadow: none; }
  .enter:active:not(:disabled) { transform: scale(.98); }
  .enter .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: rgba(255,255,255,.18); }
  .enter span { position: relative; }
  .ripple { position: absolute; border-radius: 50%; background: rgba(255,255,255,.5); transform: scale(0); animation: rip .6s ease-out; pointer-events: none; }
  @keyframes rip { to { transform: scale(4); opacity: 0; } }
  .hint { text-align: center; color: rgba(255,255,255,.45); font-size: 12px; margin-top: 10px; }
  .bye { animation: bye .45s ease-in forwards; }
  @keyframes bye { to { opacity: 0; transform: scale(1.06); filter: blur(6px); } }
  @media (max-height: 640px) { .logo { width: 90px; height: 90px; margin-top: 2vh; } h1 { font-size: 32px; margin-top: 14px; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01s !important; animation-iteration-count: 1 !important; } }
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="glow"></div>
<button class="skip" id="skip" disabled>Skip</button>
<main id="main">
  <div class="logo" id="logo" title="Tap me">
    <svg viewBox="0 0 240 240"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset=".5" stop-color="#4c6ef5"/><stop offset="1" stop-color="#22b8cf"/></linearGradient></defs><rect width="240" height="240" rx="64" fill="url(#g)"/><ellipse cx="120" cy="124" rx="86" ry="34" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="7" transform="rotate(-24 120 124)"/><path fill="#fff" d="M58 118l112-44c6-2 10 1 8 9l-19 90c-2 7-6 8-11 5l-29-22-14 13c-2 2-3 3-6 3l2-30 54-49c3-2-1-4-4-2l-66 42-29-9c-6-2-6-6 2-10z"/><circle cx="190" cy="62" r="11" fill="#fff"/></svg>
  </div>
  <h1 id="title"></h1>
  <div class="tag">All your Telegram accounts. One app.</div>
  <div class="credit" id="credit"><span id="ctext"></span><span class="cur"></span></div>

  <div class="cards" id="cards">
    <a class="card" href="https://github.com/n0obcoders" data-i="0" data-link="1">
      <div class="shine"></div>
      <div class="ic" style="background:linear-gradient(135deg,#f472b6,#a855f7)">👨‍💻</div>
      <div class="k">Developed by</div><div class="v">Nitin Shukla</div>
      <div class="go">Tap to say hi ›</div>
    </a>
    <a class="card" href="https://github.com/n0obcoders" data-i="1" data-link="1">
      <div class="shine"></div>
      <div class="ic" style="background:#24292f"><svg viewBox="0 0 24 24" width="26" height="26" fill="#fff"><path d="M12 .5C5.65.5.5 5.65.5 12a11.5 11.5 0 007.86 10.92c.58.1.79-.25.79-.56v-2c-3.2.7-3.87-1.37-3.87-1.37-.53-1.33-1.28-1.69-1.28-1.69-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.71 1.26 3.37.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 015.77 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.41-2.69 5.39-5.25 5.67.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0023.5 12C23.5 5.65 18.35.5 12 .5z"/></svg></div>
      <div class="k">GitHub</div><div class="v">github.com/n0obcoders</div>
      <div class="go">Open repositories ›</div>
    </a>
    <a class="card" href="https://n0obcoders.github.io/portfoli0/" data-i="2" data-link="1">
      <div class="shine"></div>
      <div class="ic" style="background:linear-gradient(135deg,#22b8cf,#4c6ef5)">🌐</div>
      <div class="k">Portfolio</div><div class="v">n0obcoders.github.io/portfoli0</div>
      <div class="go">Visit portfolio ›</div>
    </a>
  </div>
  <div class="dots" id="dots"><i class="on"></i><i></i><i></i></div>

  <div class="foot">
    <div class="status" id="status"><div class="sp"></div><span id="stext">Starting the secure engine…</span></div>
    <button class="enter" id="enter" disabled><div class="fill" id="fill"></div><span id="etext">Preparing…</span></button>
    <div class="hint">Tap the logo, the letters, or touch anywhere ✨</div>
  </div>
</main>
<script>
'use strict';
const bridge = window.SGBridge || null;          // present inside the Android app
const $ = (id) => document.getElementById(id);
let ready = !bridge, entered = false, interacted = false;

// ---------- title letters (tap each to make it hop)
'SessionGram'.split('').forEach((ch, i) => {
  const s = document.createElement('span'); s.textContent = ch; s.style.animationDelay = (0.25 + i * 0.05) + 's';
  s.addEventListener('pointerdown', (e) => { e.stopPropagation(); s.classList.remove('hop'); void s.offsetWidth; s.classList.add('hop'); burst(e.clientX, e.clientY, 14); });
  $('title').appendChild(s);
});

// ---------- typewriter credit, cycling through the three facts
const lines = ['Developed by Nitin Shukla', 'github.com/n0obcoders', 'n0obcoders.github.io/portfoli0'];
let li = 0;
async function typeLoop() {
  await sleep(1100);
  for (;;) {
    const t = lines[li % lines.length]; li++;
    for (let i = 1; i <= t.length; i++) { $('ctext').textContent = t.slice(0, i); await sleep(42); }
    await sleep(1900);
    for (let i = t.length; i >= 0; i--) { $('ctext').textContent = t.slice(0, i); await sleep(16); }
    await sleep(250);
  }
}
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
typeLoop();

// ---------- particle field that follows your finger
const cv = $('fx'), cx = cv.getContext('2d');
let W, H, P = [], ptr = { x: -9999, y: -9999, on: false };
const DPR = Math.min(window.devicePixelRatio || 1, 2);
function resize() { W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; cx.setTransform(DPR, 0, 0, DPR, 0, 0); }
resize(); addEventListener('resize', resize);
const N = Math.min(70, Math.round(innerWidth * innerHeight / 9000));
for (let i = 0; i < N; i++) P.push({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .4, vy: (Math.random() - .5) * .4, r: Math.random() * 1.8 + .6, life: Infinity });
function burst(x, y, n = 24) {
  for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, s = Math.random() * 4 + 1.5; P.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, r: Math.random() * 2.4 + 1, life: 60 + Math.random() * 30, hue: 190 + Math.random() * 70 }); }
}
function frame() {
  cx.clearRect(0, 0, W, H);
  for (let i = P.length - 1; i >= 0; i--) {
    const p = P[i];
    if (ptr.on && p.life === Infinity) { const dx = ptr.x - p.x, dy = ptr.y - p.y, d = Math.hypot(dx, dy); if (d < 160) { p.vx += dx / d * .06; p.vy += dy / d * .06; } }
    p.vx *= .985; p.vy *= .985; p.x += p.vx; p.y += p.vy;
    if (p.life !== Infinity) { p.life--; if (p.life <= 0) { P.splice(i, 1); continue; } }
    else { if (p.x < 0 || p.x > W) p.vx *= -1; if (p.y < 0 || p.y > H) p.vy *= -1; if (Math.abs(p.vx) < .05) p.vx += (Math.random() - .5) * .1; if (Math.abs(p.vy) < .05) p.vy += (Math.random() - .5) * .1; }
    cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 7);
    cx.fillStyle = p.life === Infinity ? 'rgba(199,210,254,.75)' : `hsla(${p.hue},90%,70%,${Math.min(1, p.life / 40)})`; cx.fill();
  }
  const base = P.filter((p) => p.life === Infinity);
  for (let i = 0; i < base.length; i++) for (let j = i + 1; j < base.length; j++) {
    const a = base[i], b = base[j], d = Math.hypot(a.x - b.x, a.y - b.y);
    if (d < 110) { cx.strokeStyle = `rgba(129,140,248,${(1 - d / 110) * .35})`; cx.lineWidth = 1; cx.beginPath(); cx.moveTo(a.x, a.y); cx.lineTo(b.x, b.y); cx.stroke(); }
  }
  if (!entered) requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
addEventListener('pointerdown', (e) => { interacted = true; ptr = { x: e.clientX, y: e.clientY, on: true }; if (!e.target.closest('.card,button')) burst(e.clientX, e.clientY, 10); });
addEventListener('pointermove', (e) => { if (ptr.on) { ptr.x = e.clientX; ptr.y = e.clientY; } });
addEventListener('pointerup', () => { ptr.on = false; });
addEventListener('pointercancel', () => { ptr.on = false; });

// ---------- logo: tap to spin + burst
$('logo').addEventListener('pointerdown', (e) => {
  e.stopPropagation(); interacted = true;
  const l = $('logo'); l.classList.remove('spin'); void l.offsetWidth; l.classList.add('spin');
  const r = l.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2, 40);
  if (navigator.vibrate) try { navigator.vibrate(15); } catch { }
});

// ---------- cards: 3D tilt under the finger / with the phone's motion, dots follow the carousel
const cards = [...document.querySelectorAll('.card')];
cards.forEach((c) => {
  c.addEventListener('pointermove', (e) => {
    const r = c.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    c.style.transform = `rotateY(${(x - .5) * 16}deg) rotateX(${(.5 - y) * 14}deg) translateZ(6px)`;
    c.style.setProperty('--mx', x * 100 + '%'); c.style.setProperty('--my', y * 100 + '%');
  });
  c.addEventListener('pointerleave', () => { c.style.transform = ''; });
  c.addEventListener('click', (e) => {
    interacted = true;
    if (bridge && bridge.openUrl) { e.preventDefault(); bridge.openUrl(c.href); }
  });
});
addEventListener('deviceorientation', (e) => {
  if (e.gamma == null) return;
  const gx = Math.max(-20, Math.min(20, e.gamma)), gy = Math.max(-20, Math.min(20, (e.beta || 0) - 40));
  cards.forEach((c) => { if (!c.matches(':hover')) c.style.transform = `rotateY(${gx * .5}deg) rotateX(${-gy * .4}deg)`; });
});
const strip = $('cards');
strip.addEventListener('scroll', () => {
  const i = Math.round(strip.scrollLeft / (cards[0].offsetWidth + 14));
  [...$('dots').children].forEach((d, k) => d.classList.toggle('on', k === i));
  interacted = true;
}, { passive: true });
// gently show off the carousel once
setTimeout(() => { if (!interacted) strip.scrollTo({ left: cards[0].offsetWidth + 14, behavior: 'smooth' }); }, 3600);
setTimeout(() => { if (!interacted) strip.scrollTo({ left: 2 * (cards[0].offsetWidth + 14), behavior: 'smooth' }); }, 5600);

// ---------- entering the app
const MIN_SHOW = 2600, AUTO_AFTER = 9000, t0 = Date.now();
function setStatus(text, cls) { $('stext').textContent = text; $('status').className = 'status ' + (cls || ''); }
function refreshButton() {
  const canGo = ready && Date.now() - t0 > MIN_SHOW;
  $('enter').disabled = !canGo; $('skip').disabled = !canGo;
  $('etext').textContent = canGo ? 'Enter SessionGram' : 'Preparing…';
}
setInterval(() => {
  refreshButton();
  if (!ready || entered) return;
  const left = AUTO_AFTER - (Date.now() - t0);
  $('fill').style.width = interacted ? '0' : Math.min(100, 100 - left / (AUTO_AFTER - MIN_SHOW) * 100) + '%';
  if (left <= 0 && !interacted) enter();
}, 100);
function enter(e) {
  if (entered || !ready) return;
  entered = true;
  if (e && e.currentTarget === $('enter')) {
    const b = $('enter'), r = b.getBoundingClientRect(), s = document.createElement('i'); s.className = 'ripple';
    s.style.width = s.style.height = r.width + 'px'; s.style.left = (e.clientX - r.left - r.width / 2) + 'px'; s.style.top = (e.clientY - r.top - r.width / 2) + 'px'; b.appendChild(s);
  }
  $('main').classList.add('bye');
  setTimeout(() => {
    if (bridge) bridge.enter();
    else { try { sessionStorage.setItem('sg_intro_seen', '1'); } catch { } location.replace('/'); }
  }, 420);
}
$('enter').addEventListener('click', enter);
$('skip').addEventListener('click', enter);

// Called by the Android app while the Telegram engine starts.
window.sgServerReady = () => { ready = true; setStatus('Secure engine ready', 'ok'); refreshButton(); };
window.sgServerError = (msg) => { setStatus(msg || 'SessionGram could not start', 'bad'); $('etext').textContent = 'Could not start'; };
window.sgServerSlow = () => setStatus('Still starting… the first launch takes a little longer');
if (ready) window.sgServerReady();
</script>
</body>
</html>
