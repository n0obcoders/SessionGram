plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.sessiongram.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.sessiongram.app'
        minSdk 24
        targetSdk 36
        versionCode 20
        versionName '2.0'
        ndk {
            abiFilters(*(project.findProperty('abis') ?: 'arm64-v8a,armeabi-v7a,x86_64').split(','))
        }
    }

    // Release signing: put sessiongram.keystore next to this file (kept out of git).
    // Password comes from KEYSTORE_PASSWORD. Without a keystore the debug key is used.
    def ksFile = file('sessiongram.keystore')
    def ksPass = System.getenv('KEYSTORE_PASSWORD') ?: ''
    signingConfigs {
        release {
            storeFile ksFile
            storePassword ksPass
            keyAlias 'sessiongram'
            keyPassword ksPass
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }


    packaging {
        jniLibs { useLegacyPackaging false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version '3.11'
        pip {
            install 'aiohttp==3.9.1'
            install 'yarl==1.9.3'
            install 'multidict==5.1.0'
            install 'frozenlist==1.4.0'
            // pyaes (a telethon dependency) is only published as a source archive; ship it as a ready wheel.
            install 'wheels/pyaes-1.6.1-py3-none-any.whl'
            install 'telethon==1.45.0'
            install 'openpyxl==3.1.5'
            install 'xlrd==2.0.1'
        }
        pyc {
            src true
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.16.0'
}
