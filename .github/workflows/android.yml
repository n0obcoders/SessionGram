name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Restore signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/sessiongram.keystore
          fi

      - name: Build APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        working-directory: android
        run: |
          ./prepare.sh
          mkdir -p ../dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            gradle assembleRelease -Pabis=$abi --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../dist/SessionGram-$abi.apk
          done

      - uses: actions/upload-artifact@v4
        with:
          name: SessionGram-apk
          path: dist/*.apk
